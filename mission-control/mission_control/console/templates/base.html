<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Factory console{% endblock %}</title>
<link rel="stylesheet" href="/static/console.css">
<script src="/static/htmx-2.0.4.min.js"></script>
<script src="/static/htmx-ext-sse-2.2.2.js"></script>
</head>
<body hx-ext="sse" sse-connect="/stream">
<header class="top">
  <a class="brand" href="/">Factory console</a>
  <span class="engine">{{ engine }}</span>
  {% if demo %}<span class="chip warn">demo data</span>{% endif %}
  <span class="spacer"></span>
  <span class="live" id="live" title="live updates"><i></i><span>connecting</span></span>
  <span class="op" title="{{ op.how }}{% if op.uid is not none %}, uid {{ op.uid }}{% endif %}">{{ op.name }}</span>
</header>
<div class="shell">
  <nav class="side" aria-label="Screens">
    {% for path, label, stage in screens %}
    <a href="/{{ path }}" class="{% if path == active %}on{% endif %}{% if stage != 'UI-0' and path != active %} later{% endif %}">{{ label }}</a>
    {% endfor %}
    <a href="{{ archon_url }}" target="_blank" rel="noopener" class="ext">Archon runs ↗</a>
  </nav>
  <main>{% block main %}{% endblock %}</main>
</div>
<script>
  const live = document.getElementById("live");
  const set = (cls, text) => { live.className = "live " + cls; live.lastElementChild.textContent = text; };
  document.body.addEventListener("htmx:sseOpen", () => set("on", "live"));
  document.body.addEventListener("htmx:sseError", () => set("off", "reconnecting"));
</script>
</body>
</html>
