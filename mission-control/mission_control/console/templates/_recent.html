<table class="events">
  <thead><tr><th>When</th><th>Type</th><th>Subject</th><th>Source</th></tr></thead>
  <tbody>
  {% for e in events %}
    <tr><td class="muted">{{ e.ago }}</td><td><span class="mono">{{ e.type }}</span></td><td class="mono">{{ e.subject }}</td><td class="muted">{{ e.source }}</td></tr>
  {% else %}
    <tr><td colspan="4" class="muted">No events stored yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
