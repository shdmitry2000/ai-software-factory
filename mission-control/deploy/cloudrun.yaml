# Adapters for the Cloud Run services. Values come from the service's environment.
ports:
  store:
    adapter: firestore
    project: ${GCP_PROJECT}
    prefix: ${MC_PREFIX:-}
  bus:
    adapter: pubsub
    project: ${GCP_PROJECT}
  notifier:
    adapter: log          # alerts as Cloud Logging entries (labels.factory_alert = "1")
