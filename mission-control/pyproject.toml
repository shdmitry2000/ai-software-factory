[project]
name = "mission-control"
version = "0.1.0"
description = "Factory-wide console and history: ports and adapters over a CloudEvents bus"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.23", "rfc3339-validator>=0.1.4"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.23", "rfc3339-validator>=0.1.4", "httpx>=0.27"]
pubsub = ["google-cloud-pubsub>=2.25"]
firestore = ["google-cloud-firestore>=2.19"]
console = ["fastapi>=0.115", "uvicorn>=0.32", "jinja2>=3.1", "python-multipart>=0.0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mission_control"]

[tool.pytest.ini_options]
testpaths = ["contract_tests", "tests"]
pythonpath = ["tests"]
