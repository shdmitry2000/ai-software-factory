name: mission-control

on:
  pull_request:
    paths: ["mission-control/**", ".github/workflows/mission-control.yml"]
  push:
    branches: [main]
    paths: ["mission-control/**", ".github/workflows/mission-control.yml"]

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.23.0 rfc3339-validator==0.1.4
      - run: python mission-control/schema/validate.py
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mission-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2 pytest==8.3.4
      - run: python -m pytest -q
